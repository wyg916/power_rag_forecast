name: v2.12 minimum quality gate

on:
  pull_request:
  push:
    branches:
      - codex/project1-v2.12.0-ai-runtime-release

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      AUTH_REQUIRED: "false"
      AI_ASSISTANT_LLM_ENABLED: "0"
      LLM_RAW_SQL_EXECUTION: "0"
      MIMO_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      KIMI_API_KEY: ""
      RAG_PREWARM_ON_STARTUP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install controlled test dependencies
        run: python -m pip install -r requirements.web.txt "pytest>=8,<9"
      - name: Verify a single migration head without a database connection
        shell: pwsh
        run: |
          $heads = @(python -m alembic heads | Select-String '\(head\)')
          if ($LASTEXITCODE -ne 0 -or $heads.Count -ne 1) { throw "Alembic head gate failed" }
      - name: AI runtime, attachment, permission and ChatBI contracts
        run: >-
          python -m pytest -q
          tests/test_ai_chat_endpoint_contract.py
          tests/test_ai_runtime_release_contract.py
          tests/test_ai_runtime_remediation_closure.py
          tests/test_ai_multi_provider_contract.py
          tests/test_chatbi_package1.py
          tests/test_chatbi_package2.py
          tests/test_chatbi_package3.py
          tests/test_chatbi_package4.py
          tests/test_chatbi_package5.py
          --maxfail=1
      - name: Offline ChatBI catalog and Golden 50 gate
        run: python scripts/chatbi_contract_gate.py --output .ci-artifacts/chatbi-contract-gate.json
      - name: No tracked production secret files
        shell: pwsh
        run: |
          if (git ls-files | Select-String '(^|/)(\.env|.*\.secret|.*\.secrets)$') { throw "Tracked secret-like file found" }

  frontend-integration-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run B-provided frontend gates when present
        working-directory: frontend
        shell: pwsh
        run: |
          $scripts = (Get-Content package.json -Raw | ConvertFrom-Json).scripts
          foreach ($name in @('typecheck', 'lint', 'test', 'build')) {
            if ($scripts.PSObject.Properties.Name -contains $name) { npm run $name }
          }
