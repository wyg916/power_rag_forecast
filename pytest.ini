[pytest]
testpaths = tests
addopts = -ra --durations=10
markers =
    slow: long-running integration-style tests, especially AI assistant flows.
    integration: tests that exercise multiple services or app layers.
    docker: tests that require Docker Compose or containerized dependencies.
    llm: tests that call or simulate LLM-backed answer generation.
    rag: tests that exercise retrieval, embedding, rerank, or knowledge-base search paths.
    no_legacy_auth: disable the explicit legacy-test admin dependency override.
filterwarnings =
    ignore::DeprecationWarning
