<html>

<head>
<meta name="renderer" content="webkit"/>
<meta name="force-rendering" content="webkit"/>
<meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no">
<script>
    function oninit(){
        var site_code = getQuery("site_code");
        var url = getQuery("url");
        document.getElementById("iframe_jiucuo").attributes["src"].value = "https://zfwzzc.www.gov.cn/check_web/errorInfo/jcInfoNew?siteCode="+site_code+"&url=" + url;
    }
    /*
    * 接收地址栏参数  key:参数名称
    * */
	  function getQuery(parameter) {
	        var url = window.location.href;//获取url
	        var model = "([?&])" + parameter + "=([^&]*)";//定义了这样一个模式
	        var oModel = new RegExp(model);//把这个模式定义成一个对象
	        if (oModel.test(url)) {//用test方法测试这个对象看是true还是false；
	            return RegExp["$2"]; //$2为RegExp对象的一个属性 与正则表达式匹配的第二个子匹配;               
	        } else {
	                return null;
	        }
	    }
    </script>

</head>


<body onload="oninit()" style="margin:0;">
    <iframe id="iframe_jiucuo" name="" scrolling="auto" frameborder="0" scrolling="yes" width="100%" height="100%" src=""></iframe>
</body>
</html>
